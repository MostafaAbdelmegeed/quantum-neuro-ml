[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-neuro-ml"
version = "0.1.0"
description = "Reproducible hybrid quantum-classical graph learning for neuroimaging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mostafa Abdelmegeed" },
]
dependencies = [
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "threadpoolctl>=3,<4",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
graph = [
  "torch>=2.5,<3",
]
quantum = [
  "pennylane>=0.43,<0.46",
]

[project.scripts]
qneuro-abide-manifest = "quantum_neuro_ml.data.abide:main"
qneuro-abide-smoke = "quantum_neuro_ml.data.smoke:main"
qneuro-abide-cohort = "quantum_neuro_ml.data.cohort:main"
qneuro-abide-build = "quantum_neuro_ml.data.dataset:main"
qneuro-abide-baseline = "quantum_neuro_ml.baselines:main"
qneuro-followup = "quantum_neuro_ml.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

